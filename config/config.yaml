database_url: sqlite:///./applysense.db
company_registry_path: data/company_registry.json
log_level: INFO

scout:
  request_timeout_seconds: 15
  retries: 3
  concurrency: 4

filters:
  keywords:
    - software engineer
    - software developer
    - software development engineer
    - web developer
    - java developer
    - react developer
    - node developer
    - sde
    - full stack
    - fullstack
    - frontend
    - front end
    - front-end
    - backend
    - back end
    - back-end
    - python developer
    - ai engineer
    - genai
    - machine learning engineer
    - associate software engineer
    - forward deployed engineer

  excluded_keywords:
    - sales
    - account
    - marketing
    - recruiter
    - support
  seniority_titles: [senior, sr, lead, staff, principal, manager, head, architect, director, vp, "vice president", chief, distinguished, fellow, executive]
  locations: []
  preferred_cities: [Noida, Gurgaon, Gurugram, Delhi, Bengaluru, Bangalore, Hyderabad, Pune, Mumbai]
  max_min_years: 2
  employment_types: [full-time]

telegram:
  enabled: true
  # Set credentials in .env; notifications remain disabled until explicitly enabled.

notifications:
  claim_lease_seconds: 900
  max_attempts: 3
  per_run_cap: 20
